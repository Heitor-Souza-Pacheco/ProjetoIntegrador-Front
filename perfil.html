<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dados pessoais | Donnuts &amp; Breack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cutive&family=Hammersmith+One&family=Holtwood+One+SC&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button class="alternar-tema" type="button" title="Ativar modo escuro">&#9790;</button>
    <a class="voltar" href="cardapio.html">
        <img src="images/2007-2-imgArrowLeftLongSolidFull1.svg" alt="">
    </a>
    <div class="conteudo-principal" role="main" id="perfil">
        <h1>Dados Pessoais</h1>
        <h2>Altere os Seus Dados</h2>
        <form id="form-perfil">
            <div class="campo">
                <label for="nome">Nome completo</label>
                <input id="nome" name="nome" type="text" autocomplete="name" minlength="2" maxlength="100" required>
            </div>
            <div class="campo">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" autocomplete="email" maxlength="191" required>
            </div>
            <div class="campo">
                <label for="telefone">Telefone</label>
                <input id="telefone" name="telefone" type="tel" autocomplete="tel-national" inputmode="numeric" minlength="14" maxlength="15" pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}" placeholder="(31) 99999-9999" required>
            </div>
            <div class="campo" id="campo-endereco">
                <label for="endereco">Endereço</label>
                <input id="endereco" name="endereco" type="text" autocomplete="street-address" minlength="3" maxlength="160" placeholder="Rua, número, bairro e cidade">
            </div>
            <div class="campo">
                <label for="senha">Nova senha (opcional)</label>
                <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="6" maxlength="64" placeholder="Deixe em branco para manter">
            </div>
            <button class="botao" type="submit">Salvar</button>
            <p role="status" id="aviso"></p>
        </form>
    </div>
    <script src="theme.js"></script>
    <script src="script.js"></script>
</body>
</html>
